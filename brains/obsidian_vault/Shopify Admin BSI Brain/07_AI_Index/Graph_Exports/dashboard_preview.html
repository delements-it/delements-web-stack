      if (node.kind === 'axis') return 10;
      if (node.kind === 'source') return Math.max(1.4, Math.min(3.2, 1.2 + view.k));
      return Math.max(5, Math.min(13, 4 + Math.sqrt(Math.max(1, node.count || node.weight || 1))));
    }
    function matches(node) {
      if (!activeGroups.has(node.group)) return false;
      if (!query) return true;
      const hay = [node.label, node.kind, node.group, node.domain, node.workflow_stage, node.source_path, node.source_url, node.raw_value].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(query);
    }
    function selectedNeighborhood() {
      neighborIds.clear();
      if (!selected) return;
      neighborIds.add(selected.id);
      for (const link of links) {
        if (link.source === selected.id) neighborIds.add(link.target);
        if (link.target === selected.id) neighborIds.add(link.source);
      }
    }
    function draw() {
      const w = canvas.width / devicePixelRatio;
      const h = canvas.height / devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.lineCap = 'round';
      selectedNeighborhood();
      for (const link of links) {
        const a = nodeById[link.source];
        const b = nodeById[link.target];
        if (!a || !b || !activeGroups.has(a.group) || !activeGroups.has(b.group)) continue;
        const highlight = selected && (link.source === selected.id || link.target === selected.id);
        if (query && !matches(a) && !matches(b) && !highlight) continue;
        if (!highlight && a.kind === 'source' && b.kind === 'source') continue;
        const p1 = screen(a);
        const p2 = screen(b);
        ctx.globalAlpha = highlight ? .72 : (a.kind === 'source' || b.kind === 'source' ? .08 : .22);
        ctx.strokeStyle = highlight ? '#f0c36a' : 'rgba(222,232,218,.5)';
        ctx.lineWidth = highlight ? 1.8 : .8;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      for (const node of nodes) {
        if (!matches(node)) continue;
        const p = screen(node);
        const r = radius(node);
        const isSelected = selected && selected.id === node.id;
        const isNeighbor = neighborIds.has(node.id);
        ctx.globalAlpha = query || isSelected || isNeighbor || node.kind !== 'source' ? 1 : .48;
        ctx.fillStyle = cssColor(node.group);
        ctx.strokeStyle = isSelected ? '#ffffff' : (isNeighbor ? '#f0c36a' : 'rgba(15,19,17,.72)');
        ctx.lineWidth = isSelected ? 3 : (isNeighbor ? 1.8 : .8);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        const shouldLabel = isSelected || node.kind === 'hub' || node.kind === 'axis' || (node.kind !== 'source' && view.k > .42) || (query && node.kind !== 'source');
        if (shouldLabel) {
          ctx.globalAlpha = 1;
          ctx.font = node.kind === 'hub' ? '700 15px system-ui' : '650 11px system-ui';
          ctx.fillStyle = '#edf2ea';
          ctx.textAlign = 'center';
          const label = node.label.length > 28 ? node.label.slice(0, 27) + '...' : node.label;
          ctx.fillText(label, p.x, p.y - r - 7);
        }
      }
      ctx.restore();
    }
    function fit() {
      const visible = nodes.filter(node => activeGroups.has(node.group));
      const xs = visible.map(node => node.x);
      const ys = visible.map(node => node.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const w = canvas.width / devicePixelRatio;
      const h = canvas.height / devicePixelRatio;
      view.k = Math.min(w / Math.max(1, maxX - minX + 220), h / Math.max(1, maxY - minY + 220));
      view.x = -((minX + maxX) / 2) * view.k;
      view.y = -((minY + maxY) / 2) * view.k;
      draw();
    }
    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * devicePixelRatio));
      canvas.height = Math.max(1, Math.floor(rect.height * devicePixelRatio));
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      fit();
    }
    function hitTest(x, y) {
      const pt = world(x, y);
      let best = null;
      let bestDist = Infinity;
      for (const node of nodes) {
        if (!matches(node)) continue;
        const dx = node.x - pt.x;
        const dy = node.y - pt.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const limit = Math.max(8 / view.k, radius(node) / view.k + 8 / view.k);
        if (dist < limit && dist < bestDist) { best = node; bestDist = dist; }
      }
      return best;
    }
    function select(node) {
      selected = node || selected;
      selectedNeighborhood();
      renderDetail();
      draw();
    }
    function renderDetail() {
      const el = document.getElementById('detail');
      if (!selected) { el.innerHTML = ''; return; }
      const linked = links.filter(link => link.source === selected.id || link.target === selected.id).length;
      const sourceUrl = selected.source_url ? `<a href="${selected.source_url}" target="_blank" rel="noreferrer">${selected.source_url}</a>` : '';
      const vaultPath = selected.vault_path ? `<code>${selected.vault_path}</code>` : '';
      const sourcePath = selected.source_path ? `<code>${selected.source_path}</code>` : '';
      el.innerHTML = `
        <div class="detail-title">${escapeHtml(selected.label)}</div>
        <span class="pill">${escapeHtml(selected.kind || '')}</span>
        <span class="pill">${escapeHtml(groupLabels[selected.group] || selected.group || '')}</span>
        <span class="pill">${linked.toLocaleString()} links</span>
        <div class="kv">
          <div><span>Count</span>${(selected.count || 0).toLocaleString()}</div>
          <div><span>Domain</span>${escapeHtml(selected.domain || '')}</div>
          <div><span>Workflow</span>${escapeHtml(selected.workflow_stage || '')}</div>
          <div><span>Status</span>${escapeHtml(selected.kanban_status || '')}</div>
          <div><span>Source path</span>${sourcePath}</div>
          <div><span>Vault path</span>${vaultPath}</div>
          <div><span>Google source</span>${sourceUrl}</div>
        </div>`;
    }
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function renderToggles() {
      const root = document.getElementById('toggles');
      const groups = Object.keys(colors).filter(group => graph.summary.groups[group]);
      root.innerHTML = groups.map(group => `
        <div class="toggle">
          <span><i class="swatch" style="background:${colors[group]}"></i>${groupLabels[group] || group} (${graph.summary.groups[group].toLocaleString()})</span>
          <button class="active" data-group="${group}">On</button>
        </div>`).join('');
      root.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          const group = button.dataset.group;
          if (activeGroups.has(group)) {
            activeGroups.delete(group);
            button.textContent = 'Off';
            button.classList.remove('active');
          } else {
            activeGroups.add(group);
            button.textContent = 'On';
            button.classList.add('active');
          }
          draw();
        });
      });
    }
    canvas.addEventListener('mousedown', event => { dragging = true; last = { x: event.clientX, y: event.clientY }; });
    window.addEventListener('mouseup', () => { dragging = false; last = null; });
    canvas.addEventListener('mousemove', event => {
      if (dragging && last) {
        view.x += event.clientX - last.x;
        view.y += event.clientY - last.y;
        last = { x: event.clientX, y: event.clientY };
        draw();
      } else {
        hover = hitTest(event.offsetX, event.offsetY);
        canvas.style.cursor = hover ? 'pointer' : 'grab';
      }
    });
    canvas.addEventListener('click', event => {
      const node = hitTest(event.offsetX, event.offsetY);
      if (node) select(node);
    });
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const before = world(event.offsetX, event.offsetY);
      const factor = event.deltaY < 0 ? 1.12 : .89;
      view.k = Math.max(.08, Math.min(3.5, view.k * factor));
      const after = world(event.offsetX, event.offsetY);
      view.x += (after.x - before.x) * view.k;
      view.y += (after.y - before.y) * view.k;
      draw();
    }, { passive: false });
    document.getElementById('zoomIn').addEventListener('click', () => { view.k = Math.min(3.5, view.k * 1.2); draw(); });
    document.getElementById('zoomOut').addEventListener('click', () => { view.k = Math.max(.08, view.k / 1.2); draw(); });
    document.getElementById('reset').addEventListener('click', fit);
    document.getElementById('search').addEventListener('input', event => {
      query = event.target.value.trim().toLowerCase();
      const first = query ? nodes.find(matches) : selected;
      if (first) selected = first;
      renderDetail();
      draw();
    });
    renderToggles();
    renderDetail();
    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
