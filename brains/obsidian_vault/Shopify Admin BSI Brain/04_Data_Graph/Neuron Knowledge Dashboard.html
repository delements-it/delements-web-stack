<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neuron Knowledge Dashboard</title>
  <style>
    :root { color-scheme: dark; --bg:#05080c; --panel:#0d141c; --line:#26384c; --text:#d8e6f3; --muted:#8aa0b8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:13px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow:hidden; }
    .app { display:grid; grid-template-columns:290px 1fr 330px; height:100vh; }
    aside { background:#071018; border-right:1px solid #172330; padding:14px; overflow:auto; }
    aside.right { border-right:0; border-left:1px solid #172330; }
    h1 { margin:0 0 10px; font-size:16px; font-weight:650; }
    h2 { margin:18px 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    button, input { background:#0e1a24; color:var(--text); border:1px solid #223244; border-radius:6px; padding:8px 10px; }
    button { cursor:pointer; }
    .controls { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:10px 0; }
    .legend { display:grid; gap:8px; }
    .legend label { display:flex; align-items:center; gap:8px; color:#b8c8d8; }
    .swatch { width:10px; height:10px; border-radius:50%; display:inline-block; }
    main { position:relative; overflow:hidden; background:radial-gradient(circle at 50% 48%, #101723 0%, #05080c 60%); }
    svg { width:100%; height:100%; display:block; cursor:grab; }
    svg.dragging { cursor:grabbing; }
    .edge { stroke:#38516b; stroke-width:1; opacity:.45; }
    .edge.active { stroke:#9bdcff; stroke-width:2; opacity:.95; }
    .node circle { stroke:#bfe8ff; stroke-opacity:.28; }
    .node text { fill:#dcecff; font-size:11px; pointer-events:none; opacity:.82; paint-order:stroke; stroke:#05080c; stroke-width:4px; }
    .node.template text { opacity:0; }
    .node.active text, .node:hover text { opacity:1; }
    .node.dim { opacity:.18; }
    .edge.dim { opacity:.06; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .metric { background:#0a131d; border:1px solid #172638; border-radius:8px; padding:10px; }
    .metric strong { display:block; font-size:18px; }
    .detail { background:#0a131d; border:1px solid #172638; border-radius:8px; padding:12px; min-height:180px; }
    .links { display:grid; gap:6px; margin-top:8px; }
    .links button { text-align:left; }
    @media (max-width: 900px) { .app { grid-template-columns:1fr; grid-template-rows:auto 1fr auto; } aside { max-height:34vh; border-right:0; border-bottom:1px solid #172330; } aside.right { border-left:0; border-top:1px solid #172330; } }
  </style>
</head>

const svg = document.getElementById('graph');
const detail = document.getElementById('detail');
const search = document.getElementById('search');
const enabledGroups = new Set(Object.keys(graph.colors));
let selected = null;
let scale = 1;
let tx = 0;
let ty = 0;
let dragging = false;
let last = null;

document.getElementById('nodeCount').textContent = graph.nodes.length;
document.getElementById('linkCount').textContent = graph.links.length;

const nodeById = new Map(graph.nodes.map(n => [n.id, n]));
const linked = new Map();
for (const link of graph.links) {
  if (!linked.has(link.source)) linked.set(link.source, new Set());
  if (!linked.has(link.target)) linked.set(link.target, new Set());
  linked.get(link.source).add(link.target);
  linked.get(link.target).add(link.source);
}

function renderLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  for (const [group, color] of Object.entries(graph.colors)) {
    const row = document.createElement('label');
    row.innerHTML = `<input type="checkbox" checked data-group="${group}"><span class="swatch" style="background:${color}"></span>${group}`;
    row.querySelector('input').addEventListener('change', event => {
      if (event.target.checked) enabledGroups.add(group); else enabledGroups.delete(group);
      render();
    });
    legend.appendChild(row);
  }
}

function transformPoint(x, y) {
  return [x * scale + tx, y * scale + ty];
}

function render() {
  const q = search.value.trim().toLowerCase();
  const activeSet = selected ? new Set([selected.id, ...(linked.get(selected.id) || [])]) : null;
  svg.innerHTML = '';
  const root = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  svg.appendChild(root);

  for (const link of graph.links) {
    const source = nodeById.get(link.source);
    const target = nodeById.get(link.target);
    if (!source || !target || !enabledGroups.has(source.group) || !enabledGroups.has(target.group)) continue;
    const [x1, y1] = transformPoint(source.x, source.y);
    const [x2, y2] = transformPoint(target.x, target.y);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', `edge ${activeSet && activeSet.has(source.id) && activeSet.has(target.id) ? 'active' : activeSet ? 'dim' : ''}`);
    root.appendChild(line);
  }

  for (const node of graph.nodes) {
    if (!enabledGroups.has(node.group)) continue;
    const matches = !q || node.title.toLowerCase().includes(q) || node.group.toLowerCase().includes(q);
    if (!matches) continue;
    const [x, y] = transformPoint(node.x, node.y);
    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const radius = Math.max(4, node.weight * scale);
    group.setAttribute('class', `node ${node.kind} ${activeSet && !activeSet.has(node.id) ? 'dim' : ''} ${selected && selected.id === node.id ? 'active' : ''}`);
    group.setAttribute('transform', `translate(${x},${y})`);
    group.addEventListener('click', event => { event.stopPropagation(); selected = node; showDetail(node); render(); });
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('r', radius);
    circle.setAttribute('fill', graph.colors[node.group] || '#fff');
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', radius + 5);
    label.setAttribute('y', 4);
    label.textContent = node.title;
    group.appendChild(circle);
    group.appendChild(label);
    root.appendChild(group);
  }
}

function showDetail(node) {
  const direct = [...(linked.get(node.id) || [])].map(id => nodeById.get(id)).filter(Boolean);
  detail.innerHTML = `<h2>${node.group} / ${node.kind}</h2><h1>${node.title}</h1><p>${node.description}</p><h2>Direct Links</h2><div class="links">${direct.map(n => `<button data-node="${n.id}">${n.title}</button>`).join('') || '<p>No direct links.</p>'}</div>`;
  detail.querySelectorAll('button[data-node]').forEach(button => {
    button.addEventListener('click', () => {
      selected = nodeById.get(button.dataset.node);
      showDetail(selected);
      render();
    });
  });
}

svg.addEventListener('click', () => { selected = null; detail.textContent = 'Click a node to inspect direct links.'; render(); });
svg.addEventListener('pointerdown', event => { dragging = true; last = [event.clientX, event.clientY]; svg.classList.add('dragging'); });
window.addEventListener('pointerup', () => { dragging = false; last = null; svg.classList.remove('dragging'); });
window.addEventListener('pointermove', event => {
  if (!dragging || !last) return;
  const dx = event.clientX - last[0], dy = event.clientY - last[1];
  tx += dx; ty += dy; last = [event.clientX, event.clientY]; render();
});
svg.addEventListener('wheel', event => {
  event.preventDefault();
  scale = Math.min(3.5, Math.max(.35, scale * (event.deltaY < 0 ? 1.1 : .9)));
  render();
}, { passive:false });
document.getElementById('zoomIn').onclick = () => { scale = Math.min(3.5, scale * 1.2); render(); };
document.getElementById('zoomOut').onclick = () => { scale = Math.max(.35, scale / 1.2); render(); };
document.getElementById('reset').onclick = () => { scale = 1; tx = 0; ty = 0; selected = null; detail.textContent = 'Click a node to inspect direct links.'; render(); };
search.addEventListener('input', render);
renderLegend();
render();
</script>
